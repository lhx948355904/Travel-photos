server:
  port: 8080

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: travel-photo-map
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  datasource:
    url: "${DB_URL:jdbc:h2:file:./data/photomap;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=RUNSCRIPT FROM 'classpath:schema-h2.sql'}"
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      mode: embedded
      schema-locations: classpath:schema-h2.sql
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket: ${COS_BUCKET:}
  region: ${COS_REGION:}
  cdn-domain: ${COS_CDN_DOMAIN:}
  local-upload-dir: ${LOCAL_UPLOAD_DIR:data/uploads}
  local-public-path: ${LOCAL_PUBLIC_PATH:/uploads}
  local-upload-enabled: ${COS_LOCAL_UPLOAD_ENABLED:false}
  local-fallback-enabled: ${COS_LOCAL_FALLBACK_ENABLED:true}
  public-read-acl-enabled: ${COS_PUBLIC_READ_ACL_ENABLED:true}
  connect-timeout-millis: ${COS_CONNECT_TIMEOUT_MILLIS:10000}
  socket-timeout-millis: ${COS_SOCKET_TIMEOUT_MILLIS:120000}
  request-timeout-millis: ${COS_REQUEST_TIMEOUT_MILLIS:120000}

jwt:
  secret: ${JWT_SECRET:travel-photo-map-jwt-secret-key-2026-change-me-in-production}
  expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

admin:
  username: ${ADMIN_USERNAME:${SITE_OWNER_USERNAME:admin}}
  password-hash: ${ADMIN_PASSWORD_HASH:}

site:
  owner-username: ${SITE_OWNER_USERNAME:${ADMIN_USERNAME:admin}}
  public-url: ${SITE_PUBLIC_URL:https://lhxjourney.cn}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://lhxjourney.cn,http://localhost:3000,http://127.0.0.1:3000}

ai:
  enabled: ${AI_ENABLED:false}
  public-enabled: ${AI_PUBLIC_ENABLED:false}
  provider: ${AI_PROVIDER:dashscope}
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
  embedding-model: ${AI_EMBEDDING_MODEL:qwen3-vl-embedding}
  embedding-dimension: ${AI_EMBEDDING_DIMENSION:1024}
  vision-model: ${AI_VISION_MODEL:qwen3-vl-flash}
  chat-model: ${AI_CHAT_MODEL:qwen3.6-flash}
  connect-timeout-ms: ${AI_REQUEST_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${AI_REQUEST_READ_TIMEOUT_MS:60000}
  rag:
    min-score: ${AI_RAG_MIN_SCORE:0.30}
    candidate-limit: ${AI_RAG_CANDIDATE_LIMIT:20}
    evidence-limit: ${AI_RAG_EVIDENCE_LIMIT:8}
    daily-generation-limit: ${AI_RAG_DAILY_GENERATION_LIMIT:300}
    rate-limit-count: ${AI_RAG_RATE_LIMIT_COUNT:10}
    rate-limit-window-seconds: ${AI_RAG_RATE_LIMIT_WINDOW_SECONDS:300}
    cache-seconds: ${AI_RAG_CACHE_SECONDS:600}
  index:
    batch-size: ${AI_INDEX_BATCH_SIZE:5}
    poll-delay-ms: ${AI_INDEX_POLL_DELAY_MS:5000}
    max-retries: ${AI_INDEX_MAX_RETRIES:3}

thrift:
  server:
    enabled: ${THRIFT_SERVER_ENABLED:true}
    host: ${THRIFT_SERVER_HOST:127.0.0.1}
    port: ${THRIFT_SERVER_PORT:9090}
