services:
  db:
    build:
      context: ./database
      args:
        PGVECTOR_IMAGE: pgvector/pgvector:0.8.2-pg15-bookworm
    container_name: photomap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: photomap
      POSTGRES_USER: ${DB_USER:-photomap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-photomap123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-photomap} -d photomap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: photomap-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        # Preserve BCrypt hashes and other secrets containing "$" verbatim.
        format: raw
    environment:
      DB_URL: jdbc:postgresql://db:5432/photomap
      DB_DRIVER: org.postgresql.Driver
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: photomap
      DB_USER: ${DB_USER:-photomap}
      DB_PASSWORD: ${DB_PASSWORD:-photomap123}
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-travel-photo-map-jwt-secret-key-2026}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      LOCAL_UPLOAD_DIR: /app/data/uploads
      THRIFT_SERVER_HOST: 0.0.0.0
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PUBLIC_ENABLED: ${AI_PUBLIC_ENABLED:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-qwen3-vl-embedding}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen3-vl-flash}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3.6-flash}
      AI_RAG_DAILY_GENERATION_LIMIT: ${AI_RAG_DAILY_GENERATION_LIMIT:-300}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    container_name: photomap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
