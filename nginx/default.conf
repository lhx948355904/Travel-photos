server {
    listen 80;
    listen [::]:80;
    server_name lhxjourney.cn;

    return 301 https://lhxjourney.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lhxjourney.cn;

    ssl_certificate /etc/nginx/certs/lhxjourney.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/lhxjourney.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    # 0 disables Nginx's request-body size limit. Production photo uploads use
    # browser-to-COS multipart upload and do not pass through this proxy.
    client_max_body_size 0;

    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/blog/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /rss.xml {
        proxy_pass http://backend:8080/api/blog/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://lhxjourney.cn/sitemap.xml\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/(api/)?(\.env|\.git|vendor|phpunit|wp-|wordpress|phpmyadmin|pma|adminer|cgi-bin) {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
